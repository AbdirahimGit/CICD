name: CI pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: python -m pip install --upgrade pip flake8

      - name: Lint
        run: flake8 . --max-line-length=100

  buildandtest:
    runs-on: ubuntu-latest

    strategy:
        matrix:
            python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: |
          cd "Task1"
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
  
      - name: run tests
        run: |
          cd "Task1"
          python -m unittest discover

      - name: notify us of success
        if: success()
        run: echo "Test passed on Python ${{ matrix.python-version }}"
  
  docker:
    needs: [lint, buildandtest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Task1/dockerfile

      - name: Build image
        run: docker build -t hello-app:${{ github.sha }} Task1